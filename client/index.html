<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwoRoom MVP</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color-scheme: dark; }
      body { margin: 0; background: #111827; color: #e5e7eb; }
      #app { display: grid; grid-template-columns: 260px 1fr 280px; height: 100vh; }
      .panel { padding: 16px; background: #1f2937; border-right: 1px solid #374151; overflow:auto; }
      .section { margin-bottom: 14px; }
      input, button, select { width: 100%; margin-top: 6px; padding: 8px; border-radius: 6px; border: 1px solid #374151; background: #0f172a; color: #e5e7eb; }
      button { cursor: pointer; background: #2563eb; border: none; }
      button.secondary { background: #374151; }
      button.danger { background: #b91c1c; }
      #game-root { position: relative; }
      #game-container { width: 100%; height: 100%; }
      #overlay { position:absolute; inset:0; pointer-events:none; }
      .hud { position:absolute; top:12px; left:12px; background: rgba(17,24,39,0.9); padding: 10px; border-radius: 8px; min-width: 220px; }
      .prompt, .menu, .modal, .toast, .end-screen { position:absolute; pointer-events:auto; }
      .prompt { bottom:16px; left: 50%; transform: translateX(-50%); background:#0f172a; padding:10px 14px; border-radius:8px; }
      .menu { bottom:56px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
      .menu button { width:auto; }
      .modal { top:50%; left:50%; transform:translate(-50%,-50%); background:#111827; border:1px solid #374151; padding:16px; border-radius:10px; min-width: 260px; }
      .toast { right:14px; bottom:14px; background:#14532d; padding: 10px 12px; border-radius:8px; max-width: 300px; }
      .end-screen { inset:0; background: rgba(17,24,39,0.82); display:flex; align-items:center; justify-content:center; }
      .card { background:#111827; border:1px solid #374151; border-radius:12px; padding:18px; min-width:300px; }
      .hidden { display:none !important; }
      ul { padding-left: 18px; }
      .intel-panel { padding: 16px; background: #1f2937; border-left: 1px solid #374151; overflow:auto; display:flex; flex-direction:column; }
      .tabs { display:flex; gap:8px; margin-bottom: 12px; }
      .tab-btn { flex:1; }
      .tab-btn.active { background:#1d4ed8; }
      .tab-content { display:none; }
      .tab-content.active { display:block; }
      .intel-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
      .intel-item { background: #111827; border: 1px solid #374151; border-radius: 8px; padding: 8px 10px; }
      .intel-name { font-weight: 600; }
      .intel-meta { font-size: 13px; color: #cbd5e1; }
      .team-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      .team-dot.blue { background: #60a5fa; }
      .team-dot.red { background: #f87171; }
      .team-dot.unknown { background: #94a3b8; }
      .chat-feed { list-style:none; margin:10px 0; padding:0; display:flex; flex-direction:column; gap:8px; max-height:55vh; overflow:auto; }
      .chat-item { background:#111827; border:1px solid #374151; border-radius:8px; padding:8px; }
      .chat-meta { font-size:12px; color:#93c5fd; margin-bottom:4px; }
      .chat-system { color:#fca5a5; font-size:13px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="panel">
        <h2>TwoRoom MVP</h2>
        <div id="lobby-ui">
          <div class="section"><label>Name<input id="nameInput" maxlength="20" /></label></div>
          <div class="section"><button id="createBtn">Create Game</button></div>
          <div class="section"><label>Code<input id="codeInput" maxlength="6" /></label><button id="joinBtn">Join Game</button></div>
          <div class="section"><button id="readyBtn" class="secondary">Toggle Ready</button></div>
          <div class="section" id="host-settings">
            <label>Rounds <input id="roundsInput" type="number" min="2" max="6" value="3" /></label>
            <label>Round Seconds <input id="secondsInput" type="number" min="30" max="180" value="60" /></label>
            <label>Hostages / Room <input id="hostagesInput" type="number" min="1" max="3" value="1" /></label>
            <label>Win Rule
              <select id="winRuleInput">
                <option value="together">Together</option>
                <option value="separated">Separated</option>
              </select>
            </label>
            <button id="startBtn">Start Game</button>
          </div>
          <div class="section hidden" id="leaderVoteControls">
            <h4>Leader Vote</h4>
            <div id="leaderVoteOptions"></div>
            <button id="submitLeaderVoteBtn" class="secondary">Submit Vote</button>
          </div>
          <div class="section"><button id="callConfidenceBtn" class="danger">Call No-Confidence Vote</button></div>
          <div class="section hidden" id="swapControls">
            <h4>Exchange Commit (Leader only)</h4>
            <div id="swapHelp"></div>
            <div id="hostageOptions"></div>
            <button id="submitHostagesBtn" class="secondary">Submit Outgoing Citizens</button>
          </div>
          <div class="section">
            <h4>Lobby</h4>
            <div id="lobbyMeta"></div>
            <ul id="playerList"></ul>
          </div>
        </div>
      </div>
      <div id="game-root">
        <div id="game-container"></div>
        <div id="overlay">
          <div id="hud" class="hud hidden"></div>
          <div id="interactPrompt" class="prompt hidden">E to interact</div>
          <div id="interactMenu" class="menu hidden">
            <button id="shareColorBtn">Request Color Share</button>
            <button id="shareCardBtn">Request Card Share</button>
          </div>
          <div id="incomingModal" class="modal hidden">
            <div id="incomingText"></div>
            <button id="acceptShareBtn">Accept</button>
            <button id="declineShareBtn" class="secondary">Decline</button>
          </div>
          <div id="toast" class="toast hidden"></div>
          <div id="endScreen" class="end-screen hidden">
            <div class="card">
              <h3 id="endTitle"></h3>
              <p id="endReason"></p>
              <button id="returnLobbyBtn">Return to Lobby</button>
            </div>
          </div>
        </div>
      </div>
      <div class="intel-panel">
        <div class="tabs">
          <button id="intelTabBtn" class="secondary tab-btn active">Intel</button>
          <button id="chatTabBtn" class="secondary tab-btn">Chat Room</button>
        </div>
        <div id="intelTab" class="tab-content active">
          <h3>Known Intel</h3>
          <div class="section" id="intelStatus">No intel yet.</div>
          <ul id="intelList" class="intel-list"></ul>
        </div>
        <div id="chatTab" class="tab-content">
          <h3>Chat Room</h3>
          <label>Chat scope
            <select id="chatScopeInput">
              <option value="game">Game-wide chat</option>
              <option value="room">Current room only</option>
              <option value="summit" class="hidden">Leader summit only</option>
            </select>
          </label>
          <ul id="chatFeed" class="chat-feed"></ul>
          <input id="chatMessageInput" maxlength="220" placeholder="Type a message" />
          <button id="sendChatBtn" class="secondary">Send</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
